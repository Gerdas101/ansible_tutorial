---

- hosts: all
  become: true
  tasks:

  - name: Install Apache2 and php package
    apt: 
      name: 
      - apache2
      - libapache2-mod-php
      state: latest
      update_cache: yes
    when: ansible_distribution in ["Ubuntu", "Debian"]

  - name: Install httpd and php package
    dnf: 
      name: 
      - httpd
      - php
      state: latest
      update_cache: yes
    when: ansible_distribution in ["Fedora", "RedHat", "CentOS"]